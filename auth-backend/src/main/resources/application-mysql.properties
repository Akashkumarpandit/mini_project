# =================================================================
# MySQL PERSISTENT DATABASE CONFIGURATION PROFILE
# Activate by running: mvn spring-boot:run -Dspring-boot.run.profiles=mysql
# Or setting: SPRING_PROFILES_ACTIVE=mysql
# =================================================================

# ── Server Configuration ─────────────────────────────────────────
server.port=${SERVER_PORT:8080}

# ── MySQL DataSource ─────────────────────────────────────────────
spring.datasource.url=jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:authdb}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${MYSQL_USER:root}
spring.datasource.password=${MYSQL_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ── JPA / Hibernate ──────────────────────────────────────────────
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# ── Disable H2 Console in MySQL mode ─────────────────────────────
spring.h2.console.enabled=false

# ── JWT Configuration ────────────────────────────────────────────
app.jwt.secret=${APP_JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
app.jwt.expiration-ms=${APP_JWT_EXPIRATION_MS:86400000}
